<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Bobby - 2D Platformer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000033; /* Darker sky for asteroids */
            font-family: 'Inter', sans-serif;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #1a1a4a, #4a69bd); /* Gradient sky */
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }
        .ui-box {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px black;
            border: 2px solid rgba(255,255,255,0.2);
        }
        #message-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            display: none;
            pointer-events: auto;
            z-index: 20;
            border: 4px solid #fff;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
        button {
            background: #ff4757;
            color: white;
            border: 2px solid #fff;
            padding: 12px 24px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
            transition: transform 0.1s;
        }
        button:hover {
            transform: scale(1.05);
            background: #ff6b81;
        }
        #boss-health-container {
            display: none;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            text-align: center;
        }
        #boss-health-bar {
            width: 100%;
            height: 24px;
            background: #333;
            border: 3px solid #ffd700; /* Gold border for king */
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 10px #ffd700;
        }
        #boss-health-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff4757, #ff6b81);
            transition: width 0.2s;
        }
        #action-toast {
            position: fixed;
            top: auto;
            bottom: calc(118px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%) translateY(-8px);
            z-index: 15;
            padding: 9px 16px;
            border: 1px solid rgba(125,249,255,.65);
            border-radius: 999px;
            background: rgba(7, 16, 42, .88);
            color: #e6fcff;
            font: 700 14px/1.2 Inter, sans-serif;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,220,255,.28);
            opacity: 0;
            pointer-events: none;
            transition: opacity .18s ease, transform .18s ease;
        }
        #action-toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
        #action-toast.warning { border-color: rgba(255,190,80,.75); color: #fff0c4; box-shadow: 0 0 20px rgba(255,150,20,.22); }
        #laser-ui { width: min(310px, 48vw); padding: 7px 10px; }
        .laser-ui-heading { display: flex; justify-content: space-between; align-items: center; font: 800 10px/1.2 Inter, sans-serif; letter-spacing: .7px; }
        #laser-status { color: #7df9ff; }
        #laser-bar { height: 8px; margin-top: 6px; border-radius: 8px; overflow: hidden; background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.28); }
        #laser-overheat-fill { height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg,#30e8df,#54a7ff); box-shadow: 0 0 10px #4ceaff; transition: width .12s linear, background .2s; }
        #laser-overheat-fill.hot { background: linear-gradient(90deg,#ffd35a,#ff813d); box-shadow: 0 0 10px #ff9b44; }
        #laser-overheat-fill.overheated { background: linear-gradient(90deg,#ff596b,#ff224e); box-shadow: 0 0 13px #ff345c; }
        .inventory-box { display: flex; align-items: center; gap: 10px; padding: 8px 10px; min-height: 56px; }
        .inventory-heading { font: 800 10px/1 Inter, sans-serif; letter-spacing: .7px; color: #e3eaff; }
        .inventory-slots { display: flex; align-items: center; gap: 7px; }
        .inventory-slot { position: relative; width: 36px; height: 36px; border: 1px solid rgba(255,255,255,.5); border-radius: 8px; display: grid; place-items: center; background: rgba(255,255,255,.12); box-shadow: inset 0 0 8px #0005; }
        .inventory-icon { width: 22px; height: 22px; border: 2px solid rgba(255,255,255,.72); border-radius: 4px; box-shadow: 2px 3px 0 #0007; }
        .inventory-icon.stone { background: linear-gradient(135deg,#c5d1d8 0 18%,#758b98 18% 57%,#4c6571 57%); }
        .inventory-icon.dirt { background: linear-gradient(135deg,#e7b16c 0 20%,#a76532 20% 65%,#74411f 65%); }
        .inventory-icon.tnt { background: linear-gradient(135deg,#ff8392 0 18%,#dc143c 18% 67%,#8f102d 67%); position: relative; }
        .inventory-icon.tnt::after { content: "T"; display: grid; place-items: center; height: 100%; color: #fff; font: 900 12px/1 Inter,sans-serif; text-shadow: 0 1px 2px #5b0010; }
        .inventory-count { position: absolute; right: -5px; bottom: -6px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 99px; display: grid; place-items: center; border: 1px solid white; background: #ffe45c; color: #171832; font: 900 10px/1 Inter,sans-serif; text-shadow: none; box-shadow: 0 1px 4px #0009; }
        #inventory-empty { color: rgba(255,255,255,.6); font: 600 10px/1 Inter,sans-serif; }
        #mobile-controls { display: none; }
        @media (max-width: 800px) and (pointer: coarse) {
            #mobile-controls { display: flex; }
            #ui-layer { padding: 8px; }
            .ui-box { font-size: 13px; padding: 6px 9px; margin-bottom: 4px; }
            #ui-layer .ui-box.text-sm { max-width: 48vw; font-size: 10px; line-height: 1.2; }
        }
        .mobile-control-btn {
            touch-action: none; user-select: none; -webkit-user-select: none;
            width: 54px; height: 54px; border-radius: 13px;
            border: 2px solid rgba(255,255,255,.65); background: rgba(15,23,42,.82);
            color: white; font-weight: 900; font-size: 22px; margin: 0; padding: 0;
        }
        .mobile-control-btn.action { width: auto; height: 44px; padding: 0 9px; font-size: 11px; background: rgba(190,24,93,.9); }
        #mobile-controls > div { pointer-events: auto; }

        @media (pointer: coarse) {
            #mobile-controls { position: fixed; left: max(8px, env(safe-area-inset-left)); right: max(8px, env(safe-area-inset-right)); bottom: calc(8px + env(safe-area-inset-bottom)); box-sizing: border-box; }
        }
        @media (pointer: coarse) and (max-width: 360px) {
            .mobile-control-btn { width: 48px; height: 48px; }
            .mobile-control-btn.action { padding: 0 6px; font-size: 10px; }
        }
</style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div>
            <div class="ui-box" id="health-ui">Hearts: ❤️ 10 / 10</div><br>
            <div class="ui-box" id="laser-ui">
                <div class="laser-ui-heading"><span>LASER HEAT</span><span id="laser-status">READY</span></div>
                <div id="laser-bar" role="meter" aria-label="Laser heat" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="laser-overheat-fill"></div></div>
            </div><br>
            <div class="ui-box inventory-box" id="inventory-ui">
                <span class="inventory-heading">BLOCKS</span>
                <span id="inventory-empty">No blocks</span>
                <div class="inventory-slots" id="inventory-slots" aria-live="polite"></div>
            </div><br>
            <div class="ui-box text-sm font-normal">
                WASD/Arrows move; hold Jump for a higher leap.<br>
                'E' picks up nearby blocks (not lava).<br>
                'T' throws the next block in your pack.<br>
                'Q' slam in midair; 'F' fires laser (watch heat).
            </div>
        </div>
        <div id="boss-health-container">
            <div class="ui-box" style="margin-bottom: 5px; color: #ffd700;">King Pirate Turtle</div>
            <div id="boss-health-bar">
                <div id="boss-health-fill"></div>
            </div>
        </div>
    </div>
    <div id="action-toast" role="status" aria-live="polite"></div>

    <div id="mobile-controls" class="fixed inset-x-0 bottom-2 z-10 items-end justify-between px-3 pointer-events-none">
        <div class="grid grid-cols-3 gap-1.5 pointer-events-auto">
            <span></span><button class="mobile-control-btn" data-key="ArrowUp">▲</button><span></span>
            <button class="mobile-control-btn" data-key="ArrowLeft">◀</button><button class="mobile-control-btn" data-key="ArrowDown">▼</button><button class="mobile-control-btn" data-key="ArrowRight">▶</button>
        </div>
        <div class="grid grid-cols-2 gap-1.5 pointer-events-auto max-w-[55vw]">
            <button class="mobile-control-btn action" data-action="KeyE">PICK UP</button>
            <button class="mobile-control-btn action" data-action="KeyT">THROW</button>
            <button class="mobile-control-btn action" data-action="KeyQ">SLAM</button>
            <button class="mobile-control-btn action" data-action="KeyF">LASER</button>
        </div>
    </div>

    <div id="message-overlay">
        <h1 id="message-title" class="text-5xl font-bold mb-4 text-yellow-400">Game Over</h1>
        <p id="message-text" class="text-2xl mb-6">You ran out of hearts.</p>
        <button onclick="resetGame()">Play Again</button>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI Elements
    const healthUI = document.getElementById('health-ui');
    const laserStatus = document.getElementById('laser-status');
    const laserOverheatFill = document.getElementById('laser-overheat-fill');
    const laserBar = document.getElementById('laser-bar');
    const inventorySlots = document.getElementById('inventory-slots');
    const inventoryEmpty = document.getElementById('inventory-empty');
    const bossHealthContainer = document.getElementById('boss-health-container');
    const bossHealthFill = document.getElementById('boss-health-fill');
    const messageOverlay = document.getElementById('message-overlay');
    const messageTitle = document.getElementById('message-title');
    const messageText = document.getElementById('message-text');
    const actionToast = document.getElementById('action-toast');
    let actionToastTimer;

    let w, h;
    function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Game Constants
    const TILE_SIZE = 50;
    const GRAVITY = 0.58;
    const FRICTION = 0.8;
    const JUMP_FORCE = -15.5;
    const JUMP_HOLD_FORCE = 0.24;
    const MAX_JUMP_HOLD_FRAMES = 12;
    const SPEED = 6;
    const MAX_HEARTS = 10;

    // Tile Types: 0:Empty, 1:Stone/Grass, 2:Dirt, 3:Lava (hazard), 4:TNT
    const COLORS = {
        1: '#55aa55', // Grass
        2: '#8b4513', // Dirt
        3: '#ff4500', // Lava
        4: '#dc143c'  // TNT
    };

    let gameState = 'playing'; // playing, gameover, win
    let camera = { x: 0, y: 0 };
    let keys = {};

    const jumpCodes = ['ArrowUp', 'KeyW', 'Space'];
    function isJumpHeld() { return jumpCodes.some(code => keys[code]); }
    function cutJumpIfReleased() {
        if (!isJumpHeld() && player) player.cutJump();
    }
    window.addEventListener('keydown', e => {
        const wasDown = keys[e.code];
        keys[e.code] = true;
        if (!e.repeat && !wasDown) handleSinglePress(e.code);
    });
    window.addEventListener('keyup', e => {
        keys[e.code] = false;
        if (jumpCodes.includes(e.code)) cutJumpIfReleased();
    });
    document.querySelectorAll('#mobile-controls [data-key], #mobile-controls [data-action]').forEach(button => {
        const code = button.dataset.key || button.dataset.action;
        button.addEventListener('pointerdown', e => {
            e.preventDefault();
            if (button.setPointerCapture) button.setPointerCapture(e.pointerId);
            keys[code] = true;
            if (button.dataset.action) handleSinglePress(code);
        });
        const release = e => {
            if (e) e.preventDefault();
            keys[code] = false;
            if (jumpCodes.includes(code)) cutJumpIfReleased();
        };
        button.addEventListener('pointerup', release);
        button.addEventListener('pointercancel', release);
        button.addEventListener('lostpointercapture', release);
    });
    window.addEventListener('blur', () => {
        keys = {};
        cutJumpIfReleased();
    });

    // Level map
    let map = [];
    const MAP_WIDTH = 80;
    const MAP_HEIGHT = 15;

    // Entities
    let player;
    let enemies = [];
    let projectiles = [];
    let boss;
    let particles = [];
    let activeEffects = []; 
    let asteroids = [];
    let slamWaves = [];
    let screenShake = 0;

    function showActionToast(message, warning = false) {
        actionToast.textContent = message;
        actionToast.classList.toggle('warning', warning);
        actionToast.classList.add('visible');
        clearTimeout(actionToastTimer);
        actionToastTimer = setTimeout(() => actionToast.classList.remove('visible'), 1350);
    }

    function createSlamWave(x, y) {
        slamWaves.push({ x, y, radius: 14, life: 24, maxLife: 24 });
        screenShake = 10;
    }

    class Player {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.width = 30;
            this.height = 50;
            this.vx = 0;
            this.vy = 0;
            this.grounded = false;
            this.hearts = MAX_HEARTS;
            this.laserHeat = 0;
            this.laserOverheated = false;
            this.inventory = [];
            this.facing = 1; // 1 right, -1 left
            this.invulnTimer = 0;
            this.slamming = false;
            this.jumpHoldFrames = 0;
            this.slamCooldown = 0;
            this.laserCooldown = 0;
            this.phase = 1; // Phase changes based on health
        }

        update() {
            if (this.invulnTimer > 0) this.invulnTimer--;
            if (this.slamCooldown > 0) this.slamCooldown--;
            if (this.laserCooldown > 0) this.laserCooldown--;
            this.laserHeat = Math.max(0, this.laserHeat - 0.45);
            if (this.laserOverheated && this.laserHeat <= 28) this.laserOverheated = false;

            // Phase update
            this.phase = this.hearts <= 3 ? 2 : 1;

            // Horizontal movement
            if (keys['ArrowLeft'] || keys['KeyA']) { this.vx -= 1.2; this.facing = -1; }
            if (keys['ArrowRight'] || keys['KeyD']) { this.vx += 1.2; this.facing = 1; }
            
            this.vx *= FRICTION;
            if (Math.abs(this.vx) < 0.01) this.vx = 0;

            // A held jump adds lift; releasing the key cuts the jump early.
            if (isJumpHeld() && this.grounded && !this.slamming) {
                this.vy = JUMP_FORCE;
                this.grounded = false;
                this.jumpHoldFrames = 0;
                createParticles(this.x + this.width/2, this.y + this.height, '#dffcff', 9, 1.2);
            }
            if (isJumpHeld() && this.vy < 0 && this.jumpHoldFrames < MAX_JUMP_HOLD_FRAMES) {
                this.vy -= JUMP_HOLD_FORCE;
                this.jumpHoldFrames++;
            }

            if (this.slamming) this.vy = Math.min(this.vy + GRAVITY * 4.5, 28);
            else this.vy += GRAVITY;

            // Limits
            let currentSpeed = this.phase === 2 ? SPEED * 1.2 : SPEED;
            if (this.vx > currentSpeed) this.vx = currentSpeed;
            if (this.vx < -currentSpeed) this.vx = -currentSpeed;

            // X Collision
            this.x += this.vx;
            this.checkCollision(true);

            // Y Collision
            this.y += this.vy;
            this.grounded = false;
            this.checkCollision(false);

            // Resolve the slam after collision detection reports a landing.
            if (this.slamming && this.grounded) {
                this.slamming = false;
                this.slamCooldown = 30;
                const impactX = this.x + this.width / 2;
                const impactY = this.y + this.height;
                createSlamWave(impactX, impactY);
                createParticles(impactX, impactY, '#7df9ff', 34, 2.2);
                enemies.forEach(e => {
                    if (Math.abs((e.x + e.width / 2) - impactX) < 165 && Math.abs((e.y + e.height) - impactY) < 110) e.takeDamage(4);
                });
                if (boss && Math.abs((boss.x + boss.width / 2) - impactX) < 210 && Math.abs((boss.y + boss.height) - impactY) < 150) boss.takeDamage(4);
                showActionToast('SLAM! Ground shockwave!');
            }

            // Bounds check
            if (this.y > MAP_HEIGHT * TILE_SIZE) this.takeDamage(10);
            if (this.x < 0) this.x = 0;

            updateUI();
        }

        cutJump() {
            if (this.vy < -4) this.vy *= 0.55;
            this.jumpHoldFrames = MAX_JUMP_HOLD_FRAMES;
        }

        checkCollision(isX) {
            const inset = 1; // 1 pixel inset to avoid snagging on floors/walls
            
            if (isX) {
                let top = Math.floor((this.y + inset) / TILE_SIZE);
                let bottom = Math.floor((this.y + this.height - inset) / TILE_SIZE);
                
                if (this.vx > 0) {
                    let right = Math.floor((this.x + this.width) / TILE_SIZE);
                    for (let r = top; r <= bottom; r++) {
                        let tile = getTile(right, r);
                        if (tile !== 0) {
                            this.x = right * TILE_SIZE - this.width;
                            this.vx = 0;
                            this.checkLava(tile);
                            break;
                        }
                    }
                } else if (this.vx < 0) {
                    let left = Math.floor(this.x / TILE_SIZE);
                    for (let r = top; r <= bottom; r++) {
                        let tile = getTile(left, r);
                        if (tile !== 0) {
                            this.x = (left + 1) * TILE_SIZE;
                            this.vx = 0;
                            this.checkLava(tile);
                            break;
                        }
                    }
                }
            } else {
                let left = Math.floor((this.x + inset) / TILE_SIZE);
                let right = Math.floor((this.x + this.width - inset) / TILE_SIZE);
                
                if (this.vy > 0) { // falling
                    let bottom = Math.floor((this.y + this.height) / TILE_SIZE);
                    for (let c = left; c <= right; c++) {
                        let tile = getTile(c, bottom);
                        if (tile !== 0) {
                            this.y = bottom * TILE_SIZE - this.height;
                            this.vy = 0;
                            this.grounded = true;
                            this.checkLava(tile);
                            break;
                        }
                    }
                } else if (this.vy < 0) { // jumping up
                    let top = Math.floor(this.y / TILE_SIZE);
                    for (let c = left; c <= right; c++) {
                        let tile = getTile(c, top);
                        if (tile !== 0) {
                            this.y = (top + 1) * TILE_SIZE;
                            this.vy = 0;
                            this.checkLava(tile);
                            break;
                        }
                    }
                }
            }
        }

        checkLava(tileType) {
            if (tileType === 3) {
                let hasLava = activeEffects.find(e => e.type === 'lava');
                if (!hasLava) {
                    activeEffects.push({ type: 'lava', duration: 180, ticksLeft: 2 });
                    this.takeDamage(1); 
                }
            }
        }

        takeDamage(amount) {
            if (this.invulnTimer > 0) return;
            this.hearts -= amount;
            this.invulnTimer = 40; 
            createParticles(this.x + this.width/2, this.y + this.height/2, '#ff0000', 15);
            if (this.hearts <= 0) {
                this.hearts = 0;
                endGame('gameover');
            }
            updateUI();
        }

        draw(ctx) {
            if (this.invulnTimer > 0 && Math.floor(Date.now() / 100) % 2 === 0) return; // flicker

            ctx.save();
            ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
            if (this.facing === -1) ctx.scale(-1, 1);

            // Stickman body
            ctx.strokeStyle = this.phase === 2 ? '#ff4444' : 'black'; // Red hue if low health
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, -10); ctx.lineTo(0, 10); // Body
            ctx.lineTo(-10, 25); ctx.moveTo(0, 10); ctx.lineTo(10, 25); // Legs
            ctx.moveTo(0, -5); ctx.lineTo(15, 0); ctx.moveTo(0, -5); ctx.lineTo(-15, 0); // Arms
            ctx.stroke();

            // Head
            ctx.beginPath();
            ctx.arc(0, -15, 12, 0, Math.PI * 2);
            ctx.fillStyle = 'white';
            ctx.fill();
            ctx.stroke();

            // Face Details
            ctx.fillStyle = 'black';
            if (this.phase === 1) {
                // Normal face
                ctx.beginPath(); ctx.arc(4, -18, 2, 0, Math.PI*2); ctx.fill(); // Right eye
                ctx.beginPath(); ctx.arc(-2, -18, 2, 0, Math.PI*2); ctx.fill(); // Left eye
                ctx.beginPath(); ctx.arc(2, -12, 4, 0, Math.PI); ctx.stroke(); // Smile
            } else {
                // Low health / Phase 2 face (angry/hurt)
                ctx.beginPath(); ctx.arc(4, -18, 2, 0, Math.PI*2); ctx.fill(); 
                ctx.beginPath(); ctx.arc(-2, -18, 2, 0, Math.PI*2); ctx.fill(); 
                ctx.beginPath(); ctx.moveTo(-4, -20); ctx.lineTo(-1, -19); ctx.stroke(); // Angry brow
                ctx.beginPath(); ctx.moveTo(6, -20); ctx.lineTo(3, -19); ctx.stroke(); 
                ctx.beginPath(); ctx.arc(2, -10, 3, Math.PI, 0); ctx.stroke(); // Frown
                // Sweat drop
                ctx.fillStyle = '#00a8ff';
                ctx.beginPath(); ctx.arc(-8, -16, 2, 0, Math.PI*2); ctx.fill();
            }

            // Red Hat
            ctx.fillStyle = 'red';
            ctx.beginPath();
            ctx.moveTo(-14, -25);
            ctx.lineTo(14, -25);
            ctx.lineTo(14, -28);
            ctx.lineTo(10, -36);
            ctx.lineTo(-10, -36);
            ctx.lineTo(-14, -28);
            ctx.fill();
            
            // Hat Brim
            ctx.fillRect(-18, -26, 36, 4);

            // Letter B on Hat
            ctx.fillStyle = 'white';
            ctx.font = 'bold 12px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('B', 0, -26);

            ctx.restore();
        }
    }

    class Enemy {
        constructor(x, y, type) {
            this.x = x;
            this.y = y;
            this.type = type; // 'cupcake', 'bombom'
            this.width = 36;
            this.height = 36;
            this.vx = type === 'cupcake' ? 1.5 : 1;
            this.vy = 0;
            this.maxHp = type === 'cupcake' ? 2 : 4;
            this.hp = this.maxHp;
            this.phase = 1;
            this.invulnTimer = 0;
        }

        takeDamage(amount) {
            if(this.invulnTimer > 0) return;
            this.hp -= amount;
            this.invulnTimer = 10;
            createParticles(this.x + this.width/2, this.y + this.height/2, '#fff', 10);
            
            if (this.hp <= 0) {
                // Defeated enemies burst into particles.
                createParticles(this.x + this.width/2, this.y + this.height/2, '#ffe36b', 16, 1.4);
                if (this.type === 'bombom') {
                    createParticles(this.x + this.width/2, this.y + this.height/2, 'orange', 30);
                }
            }
        }

        update() {
            if (this.invulnTimer > 0) this.invulnTimer--;
            
            // Phase change
            if (this.hp <= this.maxHp / 2) this.phase = 2;

            let currentVx = this.vx;
            if (this.phase === 2) currentVx *= 1.5; // Move faster in phase 2

            this.vy += GRAVITY;
            this.x += currentVx;
            this.y += this.vy;

            // Simple collision
            let left = Math.floor(this.x / TILE_SIZE);
            let right = Math.floor((this.x + this.width) / TILE_SIZE);
            let bottom = Math.floor((this.y + this.height) / TILE_SIZE);

            if (getTile(left, bottom) !== 0 || getTile(right, bottom) !== 0) {
                this.y = bottom * TILE_SIZE - this.height;
                this.vy = 0;
            }

            // Wall bounce
            if (getTile(currentVx > 0 ? right+1 : left-1, bottom-1) !== 0 || this.x <= 0) {
                this.vx *= -1;
            }

            // Hit player
            if (rectIntersect(this, player)) {
                if (this.type === 'bombom') {
                    player.takeDamage(2);
                    this.takeDamage(999); // Explodes and dies
                } else {
                    player.takeDamage(1);
                    // bounce back
                    this.vx *= -1;
                    this.x += this.vx * 5;
                }
            }
        }

        draw(ctx) {
            if (this.invulnTimer > 0 && Math.floor(Date.now() / 100) % 2 === 0) return;
            
            ctx.save();
            ctx.translate(this.x, this.y);

            if (this.type === 'cupcake') {
                // Wrapper
                ctx.fillStyle = this.phase === 2 ? '#ffb8b8' : '#ffe4e1';
                ctx.fillRect(4, 16, 28, 20);
                ctx.fillStyle = '#ff69b4'; // Icing
                ctx.beginPath();
                ctx.arc(18, 16, 16, Math.PI, 0);
                ctx.fill();
                
                // Cherry
                ctx.fillStyle = 'red';
                ctx.beginPath(); ctx.arc(18, 0, 5, 0, Math.PI*2); ctx.fill();
                
                // Face
                ctx.fillStyle = 'black';
                ctx.beginPath(); ctx.arc(12, 12, 2, 0, Math.PI*2); ctx.fill(); // L eye
                ctx.beginPath(); ctx.arc(24, 12, 2, 0, Math.PI*2); ctx.fill(); // R eye
                
                if (this.phase === 1) {
                    ctx.beginPath(); ctx.arc(18, 16, 3, 0, Math.PI); ctx.stroke(); // Smile
                } else {
                    ctx.beginPath(); ctx.moveTo(15, 18); ctx.lineTo(21, 16); ctx.stroke(); // Angry mouth
                    // Angry brows
                    ctx.beginPath(); ctx.moveTo(9, 9); ctx.lineTo(13, 10); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(27, 9); ctx.lineTo(23, 10); ctx.stroke();
                }

            } else if (this.type === 'bombom') {
                // Body
                ctx.fillStyle = this.phase === 2 ? '#662222' : '#333';
                ctx.beginPath();
                ctx.arc(18, 20, 16, 0, Math.PI*2);
                ctx.fill();
                
                // Cap
                ctx.fillStyle = '#555';
                ctx.fillRect(12, 0, 12, 6);
                
                // Fuse
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(18, 0); ctx.lineTo(22, -8); ctx.stroke();
                // Spark
                if (Math.floor(Date.now() / 100) % 2 === 0) {
                    ctx.fillStyle = 'yellow';
                    ctx.beginPath(); ctx.arc(22, -8, 4, 0, Math.PI*2); ctx.fill();
                }

                // Face
                ctx.fillStyle = 'white';
                ctx.beginPath(); ctx.arc(12, 16, 3, 0, Math.PI*2); ctx.fill(); // L eye
                ctx.beginPath(); ctx.arc(24, 16, 3, 0, Math.PI*2); ctx.fill(); // R eye
                
                ctx.fillStyle = 'black'; // Pupils
                ctx.beginPath(); ctx.arc(12, 16, 1, 0, Math.PI*2); ctx.fill(); 
                ctx.beginPath(); ctx.arc(24, 16, 1, 0, Math.PI*2); ctx.fill(); 
                
                // Jagged mouth
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(10, 24); ctx.lineTo(14, 28); ctx.lineTo(18, 24); 
                ctx.lineTo(22, 28); ctx.lineTo(26, 24);
                ctx.stroke();
                
                if (this.phase === 2) {
                    // Red glowing eyes
                    ctx.fillStyle = 'red';
                    ctx.beginPath(); ctx.arc(12, 16, 2, 0, Math.PI*2); ctx.fill(); 
                    ctx.beginPath(); ctx.arc(24, 16, 2, 0, Math.PI*2); ctx.fill(); 
                }
            }
            ctx.restore();
        }
    }

    class Boss {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.width = 140;
            this.height = 140;
            this.maxHp = 15;
            this.hp = this.maxHp;
            this.state = 'idle';
            this.timer = 0;
            this.phase = 1;
            this.invulnTimer = 0;
            this.active = false; // becomes active when player is near
        }

        takeDamage(amount) {
            if(this.invulnTimer > 0) return;
            this.hp -= amount;
            this.invulnTimer = 15;
            createParticles(this.x + this.width/2, this.y + this.height/2, '#ffaa00', 40);
        }

        update() {
            if (this.hp <= 0) {
                endGame('win');
                return;
            }
            
            if (this.invulnTimer > 0) this.invulnTimer--;

            if (!this.active) {
                if (Math.abs(player.x - this.x) < 800) this.active = true;
                return;
            }

            // Phase Update
            if (this.hp <= 7) this.phase = 2;

            // Basic AI
            this.timer++;
            let actionThreshold = this.phase === 2 ? 80 : 120; // Faster attacks in phase 2

            if (this.timer > actionThreshold) {
                this.timer = 0;
                let rand = Math.random();
                if (rand < 0.5) {
                    this.fireBreath();
                } else {
                    this.throwBomb();
                }
                
                // Move a bit
                if(this.phase === 2) {
                     this.x += (Math.random() > 0.5 ? 20 : -20);
                     if (this.x > MAP_WIDTH*TILE_SIZE - this.width) this.x = MAP_WIDTH*TILE_SIZE - this.width;
                }
            }

            // Boss fight mechanic: Asteroids falling when active
            if (Math.random() < (this.phase === 2 ? 0.03 : 0.015)) {
                let ax = camera.x + Math.random() * w;
                asteroids.push(new Asteroid(ax, camera.y - 100));
            }
        }

        fireBreath() {
            let count = this.phase === 2 ? 8 : 5;
            for(let i=0; i<count; i++) {
                setTimeout(() => {
                    if(this.hp > 0) {
                        projectiles.push(new Projectile(this.x, this.y + 60, -5 - Math.random()*2, (Math.random()-0.5)*3, 'flame'));
                    }
                }, i * 150);
            }
        }

        throwBomb() {
            let count = this.phase === 2 ? 3 : 1;
            for(let i=0; i<count; i++) {
                setTimeout(() => {
                    if(this.hp > 0) {
                         projectiles.push(new Projectile(this.x + 30, this.y + 20, -5 - Math.random()*3, -6 - Math.random()*4, 'bomb'));
                    }
                }, i * 300);
            }
        }

        draw(ctx) {
            if (this.invulnTimer > 0 && Math.floor(Date.now() / 100) % 2 === 0) return;

            ctx.save();
            ctx.translate(this.x, this.y);

            // Shell back
            ctx.fillStyle = '#006400'; 
            ctx.beginPath(); ctx.arc(90, 80, 60, 0, Math.PI*2); ctx.fill();
            
            // Shell patterns
            ctx.strokeStyle = '#004d00';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(90, 20); ctx.lineTo(60, 60); ctx.lineTo(90, 100); ctx.lineTo(120, 60); ctx.closePath();
            ctx.stroke();

            // Legs
            ctx.fillStyle = '#228b22';
            ctx.fillRect(40, 120, 30, 20);
            ctx.fillRect(110, 120, 30, 20);
            
            // Body / Belly
            ctx.fillStyle = '#ffd700'; // Gold belly
            ctx.beginPath(); ctx.ellipse(70, 80, 40, 50, 0, 0, Math.PI*2); ctx.fill();

            // Head
            ctx.fillStyle = '#228b22';
            ctx.beginPath(); ctx.arc(30, 50, 35, 0, Math.PI*2); ctx.fill();

            // Crown + Pirate Hat Combo
            // Pirate Hat Base
            ctx.fillStyle = '#111';
            ctx.beginPath();
            ctx.moveTo(-20, 30);
            ctx.lineTo(80, 30);
            ctx.lineTo(50, -10);
            ctx.lineTo(10, -10);
            ctx.fill();
            // Jolly Roger simple skull
            ctx.fillStyle = 'white';
            ctx.beginPath(); ctx.arc(30, 10, 6, 0, Math.PI*2); ctx.fill();
            ctx.fillRect(26, 16, 8, 4);

            // Gold Crown spikes coming out of hat
            ctx.fillStyle = '#ffd700';
            ctx.beginPath();
            ctx.moveTo(10, -10); ctx.lineTo(0, -30); ctx.lineTo(20, -10);
            ctx.moveTo(30, -10); ctx.lineTo(30, -35); ctx.lineTo(40, -10);
            ctx.moveTo(50, -10); ctx.lineTo(60, -30); ctx.lineTo(50, -10);
            ctx.fill();

            // Detailed Face
            // Eye Patch (Left eye from our view, Turtle's right eye)
            ctx.fillStyle = 'black';
            ctx.beginPath(); ctx.arc(15, 45, 8, 0, Math.PI*2); ctx.fill();
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(-5, 35); ctx.lineTo(35, 55); ctx.stroke();

            // Other Eye
            ctx.fillStyle = 'white';
            ctx.beginPath(); ctx.arc(40, 45, 6, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = this.phase === 2 ? 'red' : 'black';
            ctx.beginPath(); ctx.arc(38, 45, 2, 0, Math.PI*2); ctx.fill();

            // Beak / Mouth
            ctx.fillStyle = '#ddaa00';
            ctx.beginPath();
            ctx.moveTo(0, 60); ctx.lineTo(-15, 70); ctx.lineTo(0, 75);
            ctx.fill();
            
            // Angry Mouth Line
            ctx.strokeStyle = '#333';
            ctx.beginPath(); ctx.moveTo(0, 68); ctx.lineTo(-10, 70); ctx.stroke();

            if (this.phase === 2) {
                // Aura or rage indicators
                ctx.strokeStyle = 'red';
                ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(40, 35); ctx.lineTo(48, 30); ctx.stroke();
            }

            ctx.restore();
        }
    }

    class Projectile {
        constructor(x, y, vx, vy, type, facing = 1) {
            this.x = x;
            this.y = y;
            this.vx = vx;
            this.vy = vy;
            this.type = type;
            this.facing = facing;
            if (type === 'laser') {
                this.width = Math.max(0, Math.min(680, facing > 0 ? MAP_WIDTH * TILE_SIZE - x : x));
                if (facing < 0) this.x -= this.width;
                this.y -= 13;
                this.height = 26;
                this.life = 16;
                this.hitApplied = false;
            } else {
                this.width = 20;
                this.height = 20;
                this.life = 200;
            }
        }
        update() {
            this.life--;
            if (this.type !== 'laser') {
                if (this.type === 'bomb' || this.type === 'thrown_stone' || this.type === 'thrown_dirt' || this.type === 'thrown_tnt') {
                    this.vy += GRAVITY;
                }
                this.x += this.vx;
                this.y += this.vy;
                
                // Collision with player (if enemy proj)
                if ((this.type === 'bomb' || this.type === 'flame') && rectIntersect(this, player)) {
                    player.takeDamage(this.type === 'bomb' ? 3 : 1);
                    this.life = 0;
                    createParticles(this.x, this.y, 'orange', 10);
                }

                // Collision with enemies (if player thrown block)
                if (this.type === 'thrown_stone' || this.type === 'thrown_dirt' || this.type === 'thrown_tnt') {
                    const damage = this.type === 'thrown_tnt' ? 6 : this.type === 'thrown_stone' ? 3 : 2;
                    enemies.forEach(e => {
                        if (rectIntersect(this, e)) {
                            e.takeDamage(damage);
                            this.life = 0;
                            createParticles(this.x, this.y, this.type === 'thrown_tnt' ? '#ff4757' : this.type === 'thrown_stone' ? '#d3e6eb' : '#b87940', 22, 1.5);
                        }
                    });
                    if (boss && rectIntersect(this, boss)) {
                        boss.takeDamage(damage);
                        this.life = 0;
                        createParticles(this.x, this.y, '#ffb347', 22, 1.5);
                    }
                }

            } else if (!this.hitApplied) {
                // Resolve one clean hit per beam, then keep the beam alive as a visual effect.
                enemies.forEach(e => {
                    if (rectIntersect(this, e)) {
                        e.takeDamage(5);
                        createParticles(e.x + e.width / 2, e.y + e.height / 2, '#82f7ff', 14, 1.6);
                    }
                });
                if (boss && rectIntersect(this, boss)) {
                    boss.takeDamage(5);
                    createParticles(boss.x + boss.width / 2, boss.y + boss.height / 2, '#82f7ff', 20, 1.6);
                }
                this.hitApplied = true;
            }
        }
        draw(ctx) {
            if (this.type === 'flame') {
                ctx.fillStyle = '#ff4500';
                ctx.beginPath(); ctx.arc(this.x, this.y, 12, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = 'yellow';
                ctx.beginPath(); ctx.arc(this.x-2, this.y-2, 6, 0, Math.PI*2); ctx.fill();
            } else if (this.type === 'bomb') {
                ctx.fillStyle = 'black';
                ctx.beginPath(); ctx.arc(this.x, this.y, 14, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.beginPath(); ctx.moveTo(this.x, this.y-14); ctx.lineTo(this.x+4, this.y-20); ctx.stroke();
            } else if (this.type === 'laser') {
                const alpha = Math.max(0, this.life / 16);
                const pulse = 0.82 + Math.sin(Date.now() / 28) * 0.18;
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.shadowColor = '#00efff';
                ctx.shadowBlur = 28;
                ctx.fillStyle = `rgba(0, 224, 255, ${pulse})`;
                ctx.fillRect(this.x, this.y + 3, this.width, this.height - 6);
                ctx.shadowBlur = 10;
                ctx.fillStyle = '#f2ffff';
                ctx.fillRect(this.x, this.y + 9, this.width, 8);
                ctx.fillStyle = '#4bfbff';
                ctx.beginPath();
                ctx.arc(this.facing > 0 ? this.x + this.width : this.x, this.y + this.height / 2, 13 + Math.sin(Date.now() / 25) * 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            } else if (this.type === 'thrown_stone') {
                ctx.save();
                ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
                ctx.rotate(Date.now() / 95);
                ctx.fillStyle = '#9aaeb8';
                ctx.strokeStyle = '#e5f0f4';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-10, -6); ctx.lineTo(-3, -10); ctx.lineTo(9, -5); ctx.lineTo(8, 7); ctx.lineTo(-4, 10); ctx.lineTo(-10, 3);
                ctx.closePath(); ctx.fill(); ctx.stroke();
                ctx.restore();
            } else if (this.type === 'thrown_dirt') {
                ctx.fillStyle = '#a76532';
                ctx.fillRect(this.x, this.y, this.width, this.height);
                ctx.fillStyle = '#e0a45f';
                ctx.fillRect(this.x + 4, this.y + 4, 4, 4);
            } else if (this.type === 'thrown_tnt') {
                ctx.save();
                ctx.shadowColor = '#ff334f';
                ctx.shadowBlur = 8 + Math.sin(Date.now() / 35) * 5;
                ctx.fillStyle = COLORS[4];
                ctx.fillRect(this.x, this.y, 20, 20);
                ctx.fillStyle = 'white';
                ctx.font = 'bold 10px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('TNT', this.x + 10, this.y + 14);
                ctx.restore();
            }
        }
    }

    class Asteroid {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.vx = (Math.random() - 0.5) * 2;
            this.vy = 4 + Math.random() * 4;
            this.size = 15 + Math.random() * 15;
            this.rotation = 0;
            this.rotSpeed = (Math.random() - 0.5) * 0.2;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.rotation += this.rotSpeed;

            if (rectIntersect({x: this.x-this.size/2, y: this.y-this.size/2, width: this.size, height: this.size}, player)) {
                player.takeDamage(2);
                this.y = MAP_HEIGHT * TILE_SIZE + 100; // Force removal
                createParticles(this.x, this.y, 'gray', 20);
            }
        }
        draw(ctx) {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);
            ctx.fillStyle = '#666';
            ctx.beginPath();
            
            // Jagged rock shape
            for(let i=0; i<6; i++) {
                let angle = (i/6) * Math.PI*2;
                let r = this.size * (0.8 + Math.random()*0.4);
                if(i===0) ctx.moveTo(Math.cos(angle)*r, Math.sin(angle)*r);
                else ctx.lineTo(Math.cos(angle)*r, Math.sin(angle)*r);
            }
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#444';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Fire tail
            ctx.fillStyle = 'rgba(255, 100, 0, 0.5)';
            ctx.beginPath();
            ctx.arc(0, -this.size, this.size*0.8, 0, Math.PI, true);
            ctx.fill();

            ctx.restore();
        }
    }

    class Particle {
        constructor(x, y, color, speedMulti=1) {
            this.x = x;
            this.y = y;
            this.vx = (Math.random() - 0.5) * 10 * speedMulti;
            this.vy = (Math.random() - 0.5) * 10 * speedMulti;
            this.life = 1;
            this.decay = Math.random() * 0.05 + 0.02;
            this.color = color;
            this.size = Math.random() * 4 + 2;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.life -= this.decay;
        }
        draw(ctx) {
            ctx.fillStyle = this.color;
            ctx.globalAlpha = Math.max(0, this.life);
            ctx.fillRect(this.x, this.y, this.size, this.size);
            ctx.globalAlpha = 1;
        }
    }

    // Helper functions
    function getTile(c, r) {
        if (c < 0 || c >= MAP_WIDTH || r < 0 || r >= MAP_HEIGHT) return 1; // Walls outside
        return map[r][c];
    }
    function setTile(c, r, val) {
        if (c >= 0 && c < MAP_WIDTH && r >= 0 && r < MAP_HEIGHT) map[r][c] = val;
    }
    function rectIntersect(r1, r2) {
        return !(r2.x > r1.x + r1.width || 
                 r2.x + r2.width < r1.x || 
                 r2.y > r1.y + r1.height ||
                 r2.y + r2.height < r1.y);
    }
    function createParticles(x, y, color, count, speed=1) {
        for(let i=0; i<count; i++) particles.push(new Particle(x, y, color, speed));
    }

    function handleSinglePress(code) {
        if (gameState !== 'playing') return;

        if (code === 'KeyE') {
            // Pick up the nearest solid block in reach. Lava remains a hazard and cannot be carried.
            const playerCenterX = player.x + player.width / 2;
            const playerCenterY = player.y + player.height / 2;
            const centerCol = Math.floor(playerCenterX / TILE_SIZE);
            const centerRow = Math.floor(playerCenterY / TILE_SIZE);
            let target = null;
            let nearestDistance = TILE_SIZE * 1.4;
            let lavaNearby = false;

            for (let r = Math.max(0, centerRow - 2); r <= Math.min(MAP_HEIGHT - 1, centerRow + 2); r++) {
                for (let c = Math.max(0, centerCol - 2); c <= Math.min(MAP_WIDTH - 1, centerCol + 2); c++) {
                    const tile = map[r][c];
                    if (tile === 0) continue;
                    const blockX = c * TILE_SIZE + TILE_SIZE / 2;
                    const blockY = r * TILE_SIZE + TILE_SIZE / 2;
                    const distance = Math.hypot(blockX - playerCenterX, blockY - playerCenterY);
                    if (distance > TILE_SIZE * 1.4) continue;
                    if (tile === 3) { lavaNearby = true; continue; }
                    if (distance < nearestDistance) {
                        nearestDistance = distance;
                        target = { c, r, tile, x: blockX, y: blockY };
                    }
                }
            }

            if (target) {
                const item = target.tile === 1 ? 'stone' : target.tile === 2 ? 'dirt' : 'tnt';
                player.inventory.push(item);
                setTile(target.c, target.r, 0);
                createParticles(target.x, target.y, COLORS[target.tile], 18, 1.4);
                showActionToast(`${item.toUpperCase()} picked up!`);
                updateUI();
            } else if (lavaNearby) {
                showActionToast('Lava is too hot to pick up.', true);
            } else {
                showActionToast('Move closer to a block to pick it up.', true);
            }
        }
        
        if (code === 'KeyT') {
            // Throw from inventory
            if (player.inventory.length > 0) {
                let item = player.inventory.shift(); // Remove first item
                let typeStr = `thrown_${item}`;
                projectiles.push(new Projectile(
                    player.x + (player.facing === 1 ? player.width : -20), 
                    player.y + 10, 
                    player.facing * 10, 
                    -4, 
                    typeStr
                ));
                updateUI();
            }
        }

        if (code === 'KeyQ') {
            if (player.slamCooldown > 0) return;
            if (player.grounded) { showActionToast('Jump first to use the slam.', true); return; }
            player.slamming = true;
            player.vy = 2;
            player.jumpHoldFrames = MAX_JUMP_HOLD_FRAMES;
            createParticles(player.x + player.width / 2, player.y + player.height, '#7df9ff', 14, 1.5);
            showActionToast('SLAM!');
        }
        
        if (code === 'KeyF') {
            if (player.laserOverheated) { showActionToast('Laser overheated—wait for it to cool.', true); return; }
            if (player.laserCooldown > 0) return;
            player.laserCooldown = 16;
            player.laserHeat = Math.min(100, player.laserHeat + 38);
            if (player.laserHeat >= 100) player.laserOverheated = true;
            projectiles.push(new Projectile(player.x + player.width / 2, player.y + player.height / 2, 0, 0, 'laser', player.facing));
            createParticles(player.x + player.width / 2, player.y + player.height / 2, '#80f7ff', 14, 1.3);
            showActionToast(player.laserOverheated ? 'LASER OVERHEATED!' : 'LASER BLAST!');
            updateUI();
        }
    }

    function generateMap() {
        map = [];
        for (let r = 0; r < MAP_HEIGHT; r++) {
            let row = [];
            for (let c = 0; c < MAP_WIDTH; c++) {
                if (r >= MAP_HEIGHT - 2) {
                    row.push(1); // Floor
                } else if (r === MAP_HEIGHT - 3 && c > 5 && c < MAP_WIDTH - 20 && Math.random() < 0.25) {
                    // Random blocks
                    let type = Math.random();
                    if (type < 0.4) row.push(1); // stone
                    else if (type < 0.7) row.push(2); // dirt (mineable)
                    else if (type < 0.85) row.push(3); // lava (hazard)
                    else row.push(4); // TNT (mineable/explosive)
                } else if (r === MAP_HEIGHT - 6 && c > 10 && c < 20) {
                    row.push(1); // platform
                } else if (r === MAP_HEIGHT - 5 && c > 30 && c < 45 && c % 3 !== 0) {
                    row.push(1); // jumps
                } else {
                    row.push(0);
                }
            }
            map.push(row);
        }

        // Clean area for boss
        for (let r = MAP_HEIGHT - 8; r < MAP_HEIGHT - 2; r++) {
            for (let c = MAP_WIDTH - 20; c < MAP_WIDTH; c++) {
                map[r][c] = 0;
            }
        }
    }

    function initGame() {
        generateMap();
        player = new Player(100, 100);
        enemies = [];
        projectiles = [];
        particles = [];
        activeEffects = [];
        asteroids = [];
        slamWaves = [];
        screenShake = 0;
        boss = new Boss(MAP_WIDTH * TILE_SIZE - 250, (MAP_HEIGHT - 2) * TILE_SIZE - 140);

        // Spawn enemies
        for(let i=0; i<12; i++) {
            let type = Math.random() > 0.5 ? 'cupcake' : 'bombom';
            enemies.push(new Enemy(400 + i * 250, 100, type));
        }

        gameState = 'playing';
        messageOverlay.style.display = 'none';
        updateUI();
    }

    function updateUI() {
        healthUI.innerText = `Hearts: ❤️ ${player.hearts} / 10`;
        laserOverheatFill.style.width = `${player.laserHeat}%`;
        laserOverheatFill.classList.toggle('hot', player.laserHeat >= 68 && !player.laserOverheated);
        laserOverheatFill.classList.toggle('overheated', player.laserOverheated);
        laserStatus.textContent = player.laserOverheated ? 'COOLING' : player.laserHeat >= 68 ? 'HOT' : 'READY';
        laserStatus.style.color = player.laserOverheated ? '#ff6574' : player.laserHeat >= 68 ? '#ffd35a' : '#7df9ff';
        laserBar.setAttribute('aria-valuenow', String(Math.round(player.laserHeat)));

        const invCounts = { stone: 0, dirt: 0, tnt: 0 };
        player.inventory.forEach(item => invCounts[item]++);
        const blockInfo = {
            stone: { label: 'Stone/grass', className: 'stone' },
            dirt: { label: 'Dirt', className: 'dirt' },
            tnt: { label: 'TNT', className: 'tnt' }
        };
        inventorySlots.innerHTML = Object.entries(invCounts)
            .filter(([, count]) => count > 0)
            .map(([item, count]) => `<span class="inventory-slot" role="img" aria-label="${blockInfo[item].label}, ${count}" title="${blockInfo[item].label}: ${count}"><span class="inventory-icon ${blockInfo[item].className}"></span><span class="inventory-count">${count}</span></span>`)
            .join('');
        inventoryEmpty.hidden = player.inventory.length > 0;

        if (boss && boss.active) {
            bossHealthContainer.style.display = 'block';
            bossHealthFill.style.width = `${(boss.hp / boss.maxHp) * 100}%`;
        } else {
            bossHealthContainer.style.display = 'none';
        }
    }

    function endGame(state) {
        gameState = state;
        messageOverlay.style.display = 'block';
        if (state === 'win') {
            messageTitle.innerText = "Victory!";
            messageTitle.className = "text-5xl font-bold mb-4 text-green-400";
            messageText.innerText = "You defeated the King Pirate Turtle!";
        } else {
            messageTitle.innerText = "Game Over";
            messageTitle.className = "text-5xl font-bold mb-4 text-red-500";
            messageText.innerText = "You ran out of hearts.";
        }
    }

    function resetGame() {
        initGame();
    }

    function updateEffects() {
        for (let i = activeEffects.length - 1; i >= 0; i--) {
            let ef = activeEffects[i];
            ef.duration--;
            if (ef.type === 'lava' && ef.duration % 60 === 0 && ef.ticksLeft > 0) {
                player.takeDamage(1);
                ef.ticksLeft--;
            }
            if (ef.duration <= 0) {
                activeEffects.splice(i, 1);
            }
        }
    }

    function loop() {
        if (gameState === 'playing') {
            // Logic
            player.update();
            updateEffects();

            enemies.forEach(e => e.update());
            enemies = enemies.filter(e => e.hp > 0 && e.y < MAP_HEIGHT * TILE_SIZE);

            if (boss) {
                boss.update();
                if (boss.hp <= 0) boss = null;
            }

            projectiles.forEach(p => p.update());
            projectiles = projectiles.filter(p => p.life > 0 && p.y < MAP_HEIGHT * TILE_SIZE + 100);

            asteroids.forEach(a => a.update());
            asteroids = asteroids.filter(a => a.y < MAP_HEIGHT * TILE_SIZE + 50);

            particles.forEach(p => p.update());
            particles = particles.filter(p => p.life > 0);
            slamWaves.forEach(wave => { wave.radius += 7.5; wave.life--; });
            slamWaves = slamWaves.filter(wave => wave.life > 0);

            // Camera follow
            camera.x += (player.x - w / 2 - camera.x) * 0.1; // Smooth camera
            camera.y = player.y - h / 2 + 100;
            // Clamp camera
            if (camera.x < 0) camera.x = 0;
            if (camera.x > MAP_WIDTH * TILE_SIZE - w) camera.x = MAP_WIDTH * TILE_SIZE - w;
            if (camera.y > MAP_HEIGHT * TILE_SIZE - h) camera.y = MAP_HEIGHT * TILE_SIZE - h;
        }

        // Draw
        ctx.clearRect(0, 0, w, h);
        
        ctx.save();
        const shakeX = screenShake > 0 ? (Math.random() - 0.5) * screenShake : 0;
        const shakeY = screenShake > 0 ? (Math.random() - 0.5) * screenShake : 0;
        if (screenShake > 0) screenShake--;
        ctx.translate(-camera.x + shakeX, -camera.y + shakeY);

        // Draw Map
        let startCol = Math.floor(camera.x / TILE_SIZE);
        let endCol = startCol + Math.ceil(w / TILE_SIZE) + 1;
        let startRow = Math.floor(camera.y / TILE_SIZE);
        let endRow = startRow + Math.ceil(h / TILE_SIZE) + 1;

        for (let r = Math.max(0, startRow); r < Math.min(MAP_HEIGHT, endRow); r++) {
            for (let c = Math.max(0, startCol); c < Math.min(MAP_WIDTH, endCol); c++) {
                let tile = map[r][c];
                if (tile !== 0) {
                    const tx = c * TILE_SIZE;
                    const ty = r * TILE_SIZE;
                    ctx.fillStyle = COLORS[tile];
                    ctx.fillRect(tx, ty, TILE_SIZE, TILE_SIZE);
                    if (tile === 1) {
                        ctx.fillStyle = '#91dc70';
                        ctx.fillRect(tx, ty, TILE_SIZE, 9);
                        ctx.fillStyle = 'rgba(28,66,54,.38)';
                        ctx.fillRect(tx, ty + 9, TILE_SIZE, 3);
                        ctx.fillStyle = 'rgba(255,255,255,.2)';
                        ctx.fillRect(tx + 7 + (c % 3) * 7, ty + 20 + (r % 2) * 8, 5, 4);
                        ctx.fillRect(tx + 29 - (c % 4) * 3, ty + 34, 4, 4);
                    } else if (tile === 2) {
                        ctx.fillStyle = '#c88645';
                        ctx.fillRect(tx + 5, ty + 8, 11, 4);
                        ctx.fillRect(tx + 28, ty + 23, 13, 4);
                        ctx.fillStyle = 'rgba(40,20,8,.3)';
                        ctx.fillRect(tx + 17, ty + 15, 4, 4);
                        ctx.fillRect(tx + 8, ty + 35, 5, 4);
                    } else if (tile === 4) {
                        ctx.save();
                        ctx.shadowColor = '#ff304e';
                        ctx.shadowBlur = 8 + Math.sin(Date.now() / 110 + c) * 4;
                        ctx.strokeStyle = '#ff9eab';
                        ctx.lineWidth = 3;
                        ctx.strokeRect(tx + 4, ty + 4, TILE_SIZE - 8, TILE_SIZE - 8);
                        ctx.restore();
                        ctx.fillStyle = 'white';
                        ctx.font = 'bold 16px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.fillText('TNT', tx + TILE_SIZE/2, ty + TILE_SIZE/1.6);
                    } else if (tile === 3) {
                        const waveHeight = 10 + Math.sin(Date.now()/150 + c) * 5;
                        ctx.fillStyle = 'rgba(255,255,0,.48)';
                        ctx.fillRect(tx, ty, TILE_SIZE, waveHeight);
                        ctx.fillStyle = 'rgba(255,190,30,.55)';
                        ctx.fillRect(tx + 7 + (c % 3) * 5, ty + 18, 4, 8);
                    }
                    ctx.strokeStyle = 'rgba(0,0,0,0.34)';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(tx, ty, TILE_SIZE, TILE_SIZE);
                }
            }
        }

        enemies.forEach(e => e.draw(ctx));
        if (boss) boss.draw(ctx);
        player.draw(ctx);
        projectiles.forEach(p => p.draw(ctx));
        asteroids.forEach(a => a.draw(ctx));
        particles.forEach(p => p.draw(ctx));
        slamWaves.forEach(wave => {
            const alpha = wave.life / wave.maxLife;
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.strokeStyle = '#8cfaff';
            ctx.shadowColor = '#00eaff';
            ctx.shadowBlur = 22;
            ctx.lineWidth = 5 * alpha + 1;
            ctx.beginPath();
            ctx.ellipse(wave.x, wave.y, wave.radius, wave.radius * 0.28, 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        });

        ctx.restore();

        requestAnimationFrame(loop);
    }

    // Start
    initGame();
    loop();

</script>
</body>
</html>
