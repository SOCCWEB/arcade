name: Auto-Sync Game Update Dates

on:
  push:
    paths:
      - 'games/**'
    branches:
      - main

jobs:
  sync-dates:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync Game Update Dates
        run: node scripts/sync-update-dates.js

      - name: Commit and push changes if any
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add script.js
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Auto-sync game update dates in script.js [skip ci]"
            git push
          fi
